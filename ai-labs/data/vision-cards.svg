<svg xmlns="http://www.w3.org/2000/svg" width="800" height="320" viewBox="0 0 800 320"><style>text{font-family:system-ui,sans-serif;fill:#172554} .note{font-size:16px} .title{font-size:24px;font-weight:650}</style><rect width="800" height="320" fill="#f8fafc"/><text x="25" y="40" class="title">构造图像：计数、文字与遮挡</text><g transform="translate(20 35)"><rect y="25" width="360" height="220" rx="12" fill="white" stroke="#cbd5e1"/><circle cx="75" cy="115" r="24" fill="#2563eb"/><circle cx="145" cy="115" r="24" fill="#2563eb"/><rect x="55" y="170" width="45" height="45" fill="#ea580c"/><rect x="125" y="170" width="45" height="45" fill="#ea580c"/><path d="M220 95 L250 145 L190 145 Z" fill="#059669"/><text x="15" y="55" class="note">A：无遮挡</text><text x="215" y="205" font-size="28">A0 · O1</text></g><g transform="translate(410 35)"><rect y="25" width="360" height="220" rx="12" fill="white" stroke="#cbd5e1"/><circle cx="75" cy="115" r="24" fill="#2563eb"/><circle cx="145" cy="115" r="24" fill="#2563eb"/><rect x="55" y="170" width="45" height="45" fill="#ea580c"/><rect x="125" y="170" width="45" height="45" fill="#ea580c"/><path d="M220 95 L250 145 L190 145 Z" fill="#059669"/><rect x="110" y="65" width="170" height="100" fill="white" stroke="#94a3b8" stroke-dasharray="5 4"/><text x="15" y="55" class="note">B：白色区域遮挡</text><text x="215" y="205" font-size="28">A0 · O1</text></g><text x="25" y="303" class="note">人为绘制的输入；不是视觉模型输出。遮挡后可见数量不等于真实数量。</text></svg>